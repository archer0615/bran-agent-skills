name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test orchestrator runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Run orchestrator tests
        run: python -m unittest discover -s tests -v
      - name: Verify installed CLI and packaged schemas
        run: python -c "from importlib.resources import files; assert len(list(files('orchestrator').joinpath('schemas').iterdir())) >= 8; import orchestrator.cli; print('package smoke ok')"
      - name: Compile orchestrator
        run: python -m compileall -q orchestrator tests
      - name: Validate orchestrator schemas
        shell: pwsh
        run: ./scripts/validate-orchestrator.ps1
      - name: Validate package metadata
        run: python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"
      - name: Validate skill structure
        shell: pwsh
        run: ./scripts/validate-skills.ps1
      - name: Validate routing scenarios
        shell: pwsh
        run: ./scripts/validate-scenarios.ps1
      - name: Validate library boundaries
        shell: pwsh
        run: ./scripts/validate-library.ps1
      - name: Validate PowerShell syntax
        shell: pwsh
        run: ./scripts/validate-powershell.ps1
      - name: Validate Markdown
        shell: pwsh
        run: ./scripts/validate-markdown.ps1
      - name: Validate cross-document consistency
        shell: pwsh
        run: ./scripts/validate-consistency.ps1
      - name: Write validation summary
        if: always()
        shell: pwsh
        run: |
          "## Skill validation" >> $env:GITHUB_STEP_SUMMARY
          "- Skill structure: executed" >> $env:GITHUB_STEP_SUMMARY
          "- Routing scenarios and JSON cases: executed" >> $env:GITHUB_STEP_SUMMARY
          "- Library boundaries: executed" >> $env:GITHUB_STEP_SUMMARY
          "- PowerShell syntax and Markdown: executed" >> $env:GITHUB_STEP_SUMMARY
          "- Cross-document consistency: executed" >> $env:GITHUB_STEP_SUMMARY
